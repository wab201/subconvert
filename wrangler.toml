name = "subconvert"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# KV namespace binding is configured in the Cloudflare Dashboard
# (Settings -> Functions -> KV namespace bindings), NOT here.
# This keeps the repo free of account-specific IDs and lets Git
# imports deploy with zero modification.
#
# Local development: `npm run dev` auto-binds a local KV instance via
# the `--kv SUBCONVERT_KV` flag (see dev.js), so no KV config is needed here.
